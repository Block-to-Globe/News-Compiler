name: Publish site

# Validate the data, fetch the KJV verse text and the history line, deploy to GitHub Pages.
#
# Failure handling:
# - Validation failure (validate job): nothing is deployed, so the last good site stays live.
#   On a push whose commit touched only data/digest.json, that commit is reverted.
#   An issue is opened in every case.
# - Build or deploy failure (infra, KJV source down, Pages outage): nothing is reverted,
#   because the data is probably fine. An issue says the deploy failed.
#
# Commits made with the built-in GITHUB_TOKEN do not trigger other workflows, so the
# market and digest updates reach the site through this workflow (market.yml asks for a run).

on:
  push:
    branches: [main]
  schedule:
    # Backup run at 13:30 UTC. The daily digest task starts at about 11:00 UTC (summer)
    # or 12:00 UTC (winter) and can take 30+ minutes, so this runs after it has finished.
    # The same run also does the freshness check.
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data files
        run: node scripts/validate.mjs --only digest,market

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/assets
          cp -r data _site/data
          # The repo's scripture.json and history.json are mock data. Only fresh copies are deployed.
          rm -f _site/data/scripture.json _site/data/history.json

      - name: Fetch KJV text
        run: |
          node scripts/fetch-scripture.mjs --out _site/data/scripture.json
          if [ -f _site/data/scripture.json ]; then
            node scripts/validate.mjs --dir _site/data --only scripture || rm -f _site/data/scripture.json
          fi

      - name: Fetch history line
        run: |
          node scripts/fetch-history.mjs --out _site/data/history.json
          if [ -f _site/data/history.json ]; then
            node scripts/validate.mjs --dir _site/data --only history || rm -f _site/data/history.json
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs only when validation failed. Reverts a push that touched only data/digest.json.
  revert-bad-data:
    needs: validate
    if: ${{ always() && needs.validate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Revert the commit if it touched only data/digest.json
        id: revert
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "reverted=false" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only HEAD~1 HEAD)
          if [ "$files" = "data/digest.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git revert --no-edit HEAD
            if git push origin HEAD:main; then
              echo "reverted=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open an issue
        if: ${{ always() }}
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ steps.revert.outputs.reverted }}" = "true" ]; then
            what="The commit only changed data/digest.json, so it was reverted. The last good version of the site is still live."
          else
            what="Nothing was deployed, so the last good version of the site is still live. The commit was not reverted automatically (it changed more than data/digest.json, it was a scheduled run, or the revert could not be pushed)."
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "Publish failed on $short" \
            --body "Validation failed for commit $short. $what

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          The run log lists each problem."

  # Runs when build or deploy failed but validation passed. Nothing is reverted.
  report-deploy-failure:
    needs: [validate, build, deploy]
    if: ${{ always() && needs.validate.result == 'success' && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open an issue
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          gh issue create --repo "${{ github.repository }}" \
            --title "Deploy failed on $short" \
            --body "The data passed validation, but the build or the Pages deploy failed for commit $short. This is probably an infrastructure or source problem, not bad data, so nothing was reverted. The last good version of the site is still live unless the deploy step finished.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Re-run the workflow once the cause is clear."

  freshness:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The daily task should have written digest.json by 13:30 UTC, and the check allows 20 hours.
      - name: Check digest age
        id: age
        continue-on-error: true
        run: node scripts/validate.mjs --only digest --max-age-hours 20

      - name: Open an issue if stale
        if: ${{ steps.age.outcome == 'failure' }}
        run: |
          open=$(gh issue list --repo "${{ github.repository }}" --state open --search "Digest is stale in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Digest is stale" \
              --body "data/digest.json has not been updated by the daily task in the last 20 hours. The page shows a stale note after 26 hours. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
