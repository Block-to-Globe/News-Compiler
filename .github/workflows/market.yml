name: Market numbers

# Fetches the day's closing numbers into data/market.json (the only writer of that file).
# Runs after the US close on weekdays.
#
# Commits only when the numbers changed. fetchedAt changes on every run, so it is ignored
# in the comparison: a holiday or a repeat run with the same closes makes no commit and no deploy.
# Then it asks the publish workflow to deploy (commits made with the built-in token do not trigger it).
# If the source fails or the file is invalid, nothing is committed, the last good file stays,
# and an issue "Market numbers failed" is opened (or a comment is added to the open one).
#
# Requirements for the bot push:
# - Repo Settings > Actions > General > Workflow permissions: "Read and write permissions".
# - No branch protection on main that blocks github-actions[bot] from pushing (or an exception for it).

on:
  schedule:
    # 21:30 UTC = 4:30 PM Eastern in winter, 5:30 PM in summer: after the close either way.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch numbers
        id: fetch
        run: node scripts/fetch-market.mjs --out "$RUNNER_TEMP/market.json"

      - name: Check the file
        id: check
        run: node scripts/validate.mjs --dir "$RUNNER_TEMP" --only market

      - name: Commit if the numbers changed
        id: commit
        run: |
          cp "$RUNNER_TEMP/market.json" data/market.json
          # Compare everything except fetchedAt, with sorted keys so formatting does not matter.
          old=$(git show HEAD:data/market.json 2>/dev/null | jq -S 'del(.fetchedAt)' || echo "null")
          new=$(jq -S 'del(.fetchedAt)' data/market.json)
          if [ "$old" = "$new" ]; then
            echo "Only fetchedAt (or formatting) changed. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "market: $(jq -r .asOf data/market.json) close"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: gh workflow run publish.yml --ref main

      # Runs when any earlier step fails (fetch, check, commit or deploy). Lists each step's outcome.
      # Avoids a duplicate issue by commenting on the open one.
      - name: Report failure
        if: ${{ failure() }}
        run: |
          title="Market numbers failed"
          number=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The market job failed in run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Step outcomes: fetch=${{ steps.fetch.outcome }}, check=${{ steps.check.outcome }}, commit=${{ steps.commit.outcome }}, deploy=${{ steps.deploy.outcome }}. The last good data/market.json is still live. If the fetch failed, this is often a Yahoo Finance outage; re-run the workflow once the source is back."
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
